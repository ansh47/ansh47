name: Profile stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ansh47
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          config_timezone: Asia/Calcutta
          commits_authoring: ansh47
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes

  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ansh47
          outputs: |
            dist/github-snake.svg?color_snake=#008f11&color_dots=#ebedf0,#b7f5c4,#5fd47a,#00b33c,#006d22
            dist/github-snake-dark.svg?color_snake=#00ff41&color_dots=#0b140b,#003b00,#008f11,#00cc33,#00ff41
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
